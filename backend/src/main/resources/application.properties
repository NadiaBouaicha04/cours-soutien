# Connexion à PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cours_soutien
spring.datasource.username=soutien
spring.datasource.password=${DB_PASSWORD:soutien}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# JWT
app.jwt.secret=${JWT_SECRET:cle-secrete-de-developpement-a-changer-en-production-32c}
app.jwt.expiration-minutes=60
