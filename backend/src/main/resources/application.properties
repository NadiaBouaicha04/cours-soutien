# Connexion à PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cours_soutien
spring.datasource.username=soutien
spring.datasource.password=${DB_PASSWORD:soutien}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=truespring.jpa.open-in-view=false
